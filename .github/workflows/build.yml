name: Build Stream22 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create CI release keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -v \
            -keystore "$HOME/.android/stream22-ci.keystore" \
            -storetype JKS \
            -storepass android \
            -alias stream22 \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Stream 22, OU=CI, O=Stream 22, L=Unknown, ST=Unknown, C=US"

          test -f "$HOME/.android/stream22-ci.keystore"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Clean
        run: ./gradlew clean

      - name: Build Release APK
        env:
          STREAM22_KEYSTORE_PATH: ${{ env.HOME }}/.android/stream22-ci.keystore
          STREAM22_KEYSTORE_PASSWORD: android
          STREAM22_KEY_ALIAS: stream22
          STREAM22_KEY_PASSWORD: android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            find app/build -type f | sort || true
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

      - name: Verify APK signing
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Stream22-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

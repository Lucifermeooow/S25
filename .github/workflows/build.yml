name: Stream 22 CI Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Prepare Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding custom release keystore from GitHub Secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
          elif [ -f "debug.keystore.base64" ]; then
            echo "Using base64 debug keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Android Release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Validate Release APK Signature
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "ERROR: Valid signed release APK not found at $RELEASE_APK!"
            echo "Listing output directory contents:"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi

          echo "Found release APK: $RELEASE_APK"

          # Locate apksigner
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(which apksigner || true)
          fi

          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Validating signature using $APKSIGNER..."
            $APKSIGNER verify --verbose "$RELEASE_APK"
            echo "SUCCESS: APK signature verification passed!"
          else
            echo "Validating certificates in APK archive..."
            unzip -l "$RELEASE_APK" | grep -E "META-INF/.*\.(RSA|DSA|EC|SF)" || {
              echo "ERROR: Missing signature certificate files in APK archive!"
              exit 1
            }
            echo "SUCCESS: Signature certificate found!"
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: stream22-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
